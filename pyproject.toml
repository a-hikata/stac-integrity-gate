[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-integrity-gate"
dynamic = ["version"]
description = "Asset-aware semantic integrity checks: compare STAC raster declarations with the actual raster assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rasterio>=1.3"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["stac", "geotiff", "cog", "raster", "validation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]
# Optional Zarr semantic checks (metadata only). zarr 3.x reads v2+v3 stores
# (Python >= 3.11); on Python 3.10 pip resolves zarr 2.18 (v2 stores only).
# fsspec + aiohttp let zarr open stores over HTTPS.
zarr = ["zarr>=2.16", "fsspec>=2023.6", "aiohttp"]

[project.scripts]
stac-integrity = "stac_integrity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["stac_integrity"]

[tool.setuptools.dynamic]
version = { attr = "stac_integrity.__version__" }
