[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-integrity-gate"
version = "0.2.0"
description = "Asset-aware semantic integrity checks for STAC raster assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rasterio>=1.3"]
license = "MIT"

[project.scripts]
stac-integrity = "stac_integrity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["stac_integrity"]
