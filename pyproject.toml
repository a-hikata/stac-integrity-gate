[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-integrity-gate"
dynamic = ["version"]
description = "Asset-aware semantic integrity checks: compare STAC raster declarations with the actual raster assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rasterio>=1.3"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["stac", "geotiff", "cog", "raster", "validation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]
# Optional footer-only GeoParquet/Table checks, imported lazily (never core).
# >=14.0.1: fixes CVE-2023-47248 (unsafe deserialization when reading untrusted
# Parquet/IPC files) - relevant because remote catalog assets are untrusted input.
geoparquet = ["pyarrow>=14.0.1"]

[project.scripts]
stac-integrity = "stac_integrity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["stac_integrity"]

[tool.setuptools.dynamic]
version = { attr = "stac_integrity.__version__" }
